<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secret Grid · 守夜人工具</title><style>
body{margin:0;background:#171115;color:#eadfce;font-family:Georgia,"Songti SC",serif}.wrap{max-width:760px;margin:auto;padding:38px 20px 80px}header{text-align:center;padding:34px 0;border-bottom:1px solid #70503d}h1{font-size:clamp(30px,7vw,47px);font-weight:normal;margin:0;color:#e4cba5}header p{color:#b9a28d}section{margin-top:28px;background:#292020;border:1px solid #64413b;padding:26px}h2{color:#d7b883;font-weight:normal;margin-top:0}p,label{line-height:1.8;color:#d0c2b2}button,input,select{font:inherit;padding:10px 12px;border:1px solid #8d6b50;border-radius:3px}input,select{background:#171115;color:#f6ead6}button{background:#74323b;color:#fff1dc;cursor:pointer}.grid{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.grid label{background:#171115;padding:3px 9px}.result{padding:15px;background:#171115;margin-top:16px;color:#e9c995;line-height:2;min-height:24px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.row label{display:flex;flex-direction:column}.note{font-size:13px;color:#b4a294}
</style></head><body><main class="wrap"><header><h1>The Last Masquerade</h1><p>Secret Grid · 守夜人工具</p></header>
<section><h2>命运轮转</h2><p>选择本轮仍在场的玩家，然后抽取行动顺序。</p><div class="grid" id="players"></div><button id="shuffle">抽取本轮顺序</button><div class="result" id="order" aria-live="polite">等待抽取</div></section>
<section><h2>揭面审判</h2><p>输入本局核验码，选择指认者与被指认者。页面只显示本次指认是否正确。</p><label for="key">本局核验码</label><div class="row"><input id="key" type="text" autocomplete="off" spellcheck="false" placeholder="粘贴核验码"><button id="load">启用核验</button></div><p class="note" id="keyStatus">核验码由发信脚本生成，请勿发送给玩家。</p><div class="row"><label>指认者<select id="accuser"></select></label><label>被指认者<select id="target"></select></label><button id="judge">确认指认</button></div><div class="result" id="verdict" aria-live="polite">等待指认</div><p class="note">仅判断宿敌关系；出局、指认次数和获胜状态请由守夜人记录。核验在本设备完成，不上传数据。</p></section>
<section><h2>命运法则</h2><p>每轮在空格放置 🎃 或 💀，或选择 Pass。观察他人的行动、试探宿敌，在封盘前决定是否指认。命运碎片可以交易并换取额外行动。</p><p class="note">完整法则和正式视觉设计将在后续版本接入。</p></section></main>
<script>
const players=document.querySelector('#players');const ids=Array.from({length:10},(_,i)=>i+1);ids.forEach(n=>{const label=document.createElement('label');const box=document.createElement('input');box.type='checkbox';box.value=n;box.checked=true;label.append(box,' '+n+' 号');players.append(label)});for(const id of ['accuser','target'])ids.forEach(n=>document.querySelector('#'+id).add(new Option(n+' 号',n)));document.querySelector('#target').value='2';
document.querySelector('#shuffle').onclick=()=>{const a=[...players.querySelectorAll('input:checked')].map(x=>x.value);if(!a.length){document.querySelector('#order').textContent='请至少选择一位玩家。';return}for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}document.querySelector('#order').textContent=a.map(x=>x+' 号').join('　→　')};
let pairs=null;document.querySelector('#load').onclick=()=>{try{const raw=document.querySelector('#key').value.trim();if(!raw.startsWith('SG1:'))throw 0;const b=raw.slice(4).replace(/-/g,'+').replace(/_/g,'/');const p=JSON.parse(atob(b));if(!Array.isArray(p)||p.length!==10||p.some((v,i)=>!Number.isInteger(v)||v<1||v>10||v===i+1||p[v-1]!==i+1))throw 0;pairs=p;document.querySelector('#key').value='';document.querySelector('#keyStatus').textContent='核验已启用。本局信息保存在当前页面内。';document.querySelector('#verdict').textContent='等待指认'}catch(e){pairs=null;document.querySelector('#keyStatus').textContent='核验码无效，请检查后重新输入。'}};
document.querySelector('#judge').onclick=()=>{const a=Number(document.querySelector('#accuser').value),b=Number(document.querySelector('#target').value);const out=document.querySelector('#verdict');if(!pairs){out.textContent='请先启用本局核验码。';return}if(a===b){out.textContent='请选择两位不同的玩家。';return}out.textContent=pairs[a-1]===b?'指认正确。':'指认错误。'};
</script></body></html>
